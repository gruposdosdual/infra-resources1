name: Deploy Solution

on:
  push:
    branches:
      - test  # Ejecutar cuando se haga un push a la rama test

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout del código del repositorio
    - name: Checkout code
      uses: actions/checkout@v3

    # 2. Configurar las credenciales de AWS
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v3
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: eu-west-3  # Cambia a tu región

    # 3. Instalar Ansible
    - name: Install Ansible
      run: |
        sudo apt update
        sudo apt install -y ansible

    # 4. Ejecutar el playbook de Ansible
    - name: Run Ansible Playbook
      run: |
        ansible-playbook -i hosts.ini install.yaml
