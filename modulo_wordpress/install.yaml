---
- name: Install Docker, Docker Compose, and Apache
  hosts: web_server_dad
  become: true
  vars:
    container_count: 1
    default_container_name: docker
    default_container_image: ubuntu
    default_container_command: sleep 1d
 
  tasks:
    - name: Actualizar todos los paquetes a la última versión
      apt:
        update_cache: yes  # Actualiza el índice de los paquetes
        upgrade: dist  # Realiza la actualización completa del sistema
        autoremove: yes  # Elimina los paquetes innecesarios
        autoclean: yes  # Limpia el cache de paquetes descargados
    - name: Install aptitude
      apt:
        name: aptitude
        state: latest
        update_cache: true
 
    - name: Install required system packages
      apt:
        pkg:
          - apt-transport-https
          - ca-certificates
          - curl
          - software-properties-common
          - python3-pip
          - virtualenv
          - python3-setuptools
        state: latest
        update_cache: true
 
    - name: Add Docker GPG apt Key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present
 
    - name: Add Docker Repository
      apt_repository:
        repo: deb https://download.docker.com/linux/ubuntu {{ ansible_lsb.codename }} stable
        state: present
 
    - name: Update apt and install docker-ce
      apt:
        name: docker-ce
        state: latest
        update_cache: true
 
    - name: Install Docker Module for Python
      pip:
        name: docker
 
    - name: Add remote "ubuntu" user to "docker" group
      user:
        name: ubuntu
        groups: docker
        append: yes

    - name: Copy docker-compose.yml to the server
      copy:
        src:  docker-compose.yml  # Ruta al archivo docker-compose.yml local
        dest: /home/ubuntu/docker-compose.yml
        mode: '0644'

    - name: Copy wp-config.php to the server
      copy:
        src:  wp-config.php  # Ruta al archivo docker-compose.yml local
        dest: /home/ubuntu/wp-config.php
        mode: '0644'

    - name: Start Docker containers using Docker Compose (v2)
      ansible.builtin.shell:
        cmd: docker compose -f /home/ubuntu/docker-compose.yml up -d

    - name: If follow=yes, /path/to/file will be overwritten by contents of foo.conf
      ansible.builtin.copy:
        src: /home/ubuntu/wp-config.php
        dest: /home/ubuntu/wordpress/wp-config.php  
        follow: no
        remote_src: yes

    - name: Restart Docker containers using Docker Compose
      ansible.builtin.shell:
        cmd: docker compose -f /home/ubuntu/docker-compose.yml restart
        chdir: /home/ubuntu