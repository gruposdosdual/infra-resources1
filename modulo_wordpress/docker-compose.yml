version: '3.8'

services:
  wordpress:
    image: wordpress:latest
    container_name: wordpress
    environment:
      WORDPRESS_DB_HOST: ${DB_HOST}  # Aquí va el endpoint de tu RDS MySQL
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "80:80"
    networks:
      - wordpress-network

  apache:
    image: httpd:latest
    container_name: apache
    volumes:
      - ./apache-config:/usr/local/apache2/conf
    ports:
      - "8080:80"
    networks:
      - wordpress-network

networks:
  wordpress-network:
    driver: bridge
